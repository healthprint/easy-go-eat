<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日食乜好？美食抽籤器</title>
  <style>
    :root {
      --primary: #FF5722;
      --secondary: #FFC107;
      --accent: #E91E63;
      --bg: #FFF8E1;
      --card-bg: #FFFFFF;
      --text: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      max-width: 520px; /* 擴大手機介面寬度上限 */
      margin: 0 auto;
      padding: 16px;    /* 增加頁面留白 */
      min-height: 100vh;
      justify-content: space-between;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.35rem;
      color: #D84315;
      font-weight: 800;
    }

    .stats-badge {
      background: linear-gradient(135deg, #FF9800, #F44336);
      color: white;
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      text-align: right;
      line-height: 1.3;
    }

    /* 放大一鍵抽選按鈕 */
    .action-btn-main {
      background: linear-gradient(135deg, #FF4081, #FF5722);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 87, 34, 0.35);
      margin-bottom: 12px;
      text-align: center;
    }

    .action-btn-main:active {
      transform: scale(0.98);
    }

    /* 抽選卡片容器 */
    .slots-container {
      display: flex;
      flex-direction: column;
      gap: 10px; /* 增加格子之間的距離 */
      flex: 1;   /* 讓內容區域適度展開填滿畫面 */
      margin-bottom: 12px;
    }

    /* 放大抽選格子卡片 */
    .slot-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px; /* 放大內邊距，讓格子變大 */
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
      border-left: 5px solid var(--primary);
    }

    .slot-card:nth-child(1) { border-color: #FF5722; }
    .slot-card:nth-child(2) { border-color: #2196F3; }
    .slot-card:nth-child(3) { border-color: #4CAF50; }
    .slot-card:nth-child(4) { border-color: #9C27B0; }

    .slot-info {
      flex: 1;
      padding-right: 8px;
    }

    .slot-title {
      font-size: 0.8rem;
      color: #777;
      margin-bottom: 3px;
    }

    .slot-value {
      font-size: 1.05rem; /* 放大抽取到的菜色名稱 */
      font-weight: bold;
      color: #222;
    }

    .slot-meta {
      font-size: 0.75rem;
      color: #777;
      margin-top: 3px;
    }

    /* 放大特色三文治/薯卷圖片 */
    .food-img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 8px;
      margin-right: 10px;
      display: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.12);
    }

    .redraw-btn {
      background-color: #F0F0F0;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: bold;
      color: #555;
      cursor: pointer;
    }

    .redraw-btn:active {
      background-color: #E0E0E0;
    }

    /* 飲品區塊放大 */
    .drink-section {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
      border-left: 5px solid #00BCD4;
      margin-bottom: 10px;
    }

    .drink-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #00838F;
      margin-bottom: 8px;
    }

    .drink-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
    }

    .drink-options label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    #loading {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,248,225,0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--primary);
      z-index: 10;
    }

    .shake {
      animation: pop 0.2s ease-in-out;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="loading">🚀 載入菜單數據中...</div>

  <header>
    <h1>🎲 今日餐點抽選</h1>
    <div class="stats-badge">
      <div>💰 <span id="total-price">0</span> 元</div>
      <div>🔥 <span id="total-cal">0</span> kcal</div>
    </div>
  </header>

  <button class="action-btn-main" onclick="drawAll()">✨ 一鍵隨機抽選四款 ✨</button>

  <div class="slots-container">
    <!-- 項目 1: 特色三文治/薯卷 -->
    <div class="slot-card" id="card-0">
      <img id="item1-img" class="food-img" src="" alt="餐點圖片">
      <div class="slot-info">
        <div class="slot-title">1. 特色三文治 / 薯卷</div>
        <div class="slot-value" id="val-0">未抽取</div>
        <div class="slot-meta" id="meta-0">-</div>
      </div>
      <button class="redraw-btn" onclick="drawSingle(0)">🔄 重抽</button>
    </div>

    <!-- 項目 2: 蛋白質 -->
    <div class="slot-card" id="card-1">
      <div class="slot-info">
        <div class="slot-title">2. 蛋白質</div>
        <div class="slot-value" id="val-1">未抽取</div>
        <div class="slot-meta" id="meta-1">-</div>
      </div>
      <button class="redraw-btn" onclick="drawSingle(1)">🔄 重抽</button>
    </div>

    <!-- 項目 3: 醬汁 -->
    <div class="slot-card" id="card-2">
      <div class="slot-info">
        <div class="slot-title">3. 醬汁</div>
        <div class="slot-value" id="val-2">未抽取</div>
        <div class="slot-meta" id="meta-2">-</div>
      </div>
      <button class="redraw-btn" onclick="drawSingle(2)">🔄 重抽</button>
    </div>

    <!-- 項目 4: 特色醃菜 -->
    <div class="slot-card" id="card-3">
      <div class="slot-info">
        <div class="slot-title">4. 特色醃菜</div>
        <div class="slot-value" id="val-3">未抽取</div>
        <div class="slot-meta" id="meta-3">-</div>
      </div>
      <button class="redraw-btn" onclick="drawSingle(3)">🔄 重抽</button>
    </div>
  </div>

  <!-- 飲品剔選區 (不計算卡路里) -->
  <div class="drink-section">
    <div class="drink-title">🥤 加購飲品（勾選後計入總價）</div>
    <div class="drink-options" id="drink-container">
      <!-- 動態載入飲品選項 -->
    </div>
  </div>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS5gg8oBHWFkx3TZvmsW4BXNdQQbeOcDLBcYVL-N6qAx9m7ZKX7ysOjyQPEyPp1SF7np8IQ_fy2Lgg/pub?output=csv';

    const IMAGE_CONFIG = {
      sandwich: './OME.png',   
      potatoRoll: './ROLL.png' 
    };

    let menuCategories = [[], [], [], []]; 
    let drinksList = []; 
    let selectedItems = [null, null, null, null];

    async function loadData() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const data = await response.text();
        parseCSV(data);
        document.getElementById('loading').style.display = 'none';
        drawAll(); 
      } catch (error) {
        console.error('Data load error:', error);
        document.getElementById('loading').innerText = '❌ 載入失敗，請確認 Google 試算表發布權限';
      }
    }

    function parseCSV(csvText) {
      const lines = csvText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length < 2) return;

      menuCategories = [[], [], [], []];
      drinksList = [];

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
        if (cols.length >= 4) {
          const categoryName = cols[0];
          const item = {
            name: cols[1],
            price: parseFloat(cols[2]) || 0,
            cal: parseFloat(cols[3]) || 0
          };

          if (categoryName.includes('三文治') || categoryName.includes('薯卷')) {
            menuCategories[0].push(item);
          } else if (categoryName.includes('蛋白質')) {
            menuCategories[1].push(item);
          } else if (categoryName.includes('醬汁')) {
            menuCategories[2].push(item);
          } else if (categoryName.includes('醃菜') || categoryName.includes('特式醃菜')) {
            menuCategories[3].push(item);
          } else if (categoryName.includes('飲品') || categoryName.includes('追加飲品')) {
            drinksList.push(item);
          }
        }
      }
      renderDrinks();
    }

    function renderDrinks() {
      const container = document.getElementById('drink-container');
      container.innerHTML = '';
      if (drinksList.length === 0) {
        container.innerHTML = '<span style="color:#888;">暫無飲品選項</span>';
        return;
      }
      drinksList.forEach((drink, index) => {
        const label = document.createElement('label');
        label.innerHTML = `
          <input type="checkbox" value="${index}" onchange="updateTotals()">
          ${drink.name} (+$${drink.price})
        `;
        container.appendChild(label);
      });
    }

    function getRandomItem(catIndex) {
      const list = menuCategories[catIndex];
      if (!list || list.length === 0) {
        return { name: '該分類無資料', price: 0, cal: 0 };
      }
      return list[Math.floor(Math.random() * list.length)];
    }

    function drawSingle(index) {
      const item = getRandomItem(index);
      selectedItems[index] = item;
      updateUI(index);
      updateTotals();

      const card = document.getElementById(`card-${index}`);
      card.classList.remove('shake');
      void card.offsetWidth; 
      card.classList.add('shake');
    }

    function drawAll() {
      for (let i = 0; i < 4; i++) {
        drawSingle(i);
      }
    }

    function updateUI(index) {
      const item = selectedItems[index];
      if (!item) return;

      document.getElementById(`val-${index}`).innerText = item.name;
      document.getElementById(`meta-${index}`).innerText = `💰 $${item.price} | 🔥 ${item.cal} kcal`;

      if (index === 0) {
        const imgEl = document.getElementById('item1-img');
        if (item.name.includes('三文治') || item.name.toLowerCase().includes('sandwich')) {
          imgEl.src = IMAGE_CONFIG.sandwich;
          imgEl.style.display = 'block';
        } else if (item.name.includes('薯卷') || item.name.toLowerCase().includes('roll')) {
          imgEl.src = IMAGE_CONFIG.potatoRoll;
          imgEl.style.display = 'block';
        } else {
          imgEl.style.display = 'none';
        }
      }
    }

    function updateTotals() {
      let totalPrice = 0;
      let totalCal = 0;

      selectedItems.forEach(item => {
        if (item) {
          totalPrice += item.price;
          totalCal += item.cal;
        }
      });

      const checkboxes = document.querySelectorAll('.drink-options input[type="checkbox"]:checked');
      checkboxes.forEach(chk => {
        const drinkIndex = parseInt(chk.value);
        const drink = drinksList[drinkIndex];
        if (drink) {
          totalPrice += drink.price;
        }
      });

      document.getElementById('total-price').innerText = totalPrice;
      document.getElementById('total-cal').innerText = totalCal;
    }

    window.onload = loadData;
  </script>
</body>
</html>
