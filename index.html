<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASY GO, EASY EAT! 自助點餐</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --secondary: #F7C59F;
            --accent: #2E4057;
            --bg-color: #FFF9F5;
            --card-bg: #FFFFFF;
            --text-main: #2D3142;
            --shadow: 0 10px 30px rgba(255, 107, 53, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 80px;
        }

        /* 標題樣式 */
        header {
            text-align: center;
            margin-bottom: 35px;
            padding-top: 15px;
        }

        header h1 {
            font-size: 2.8rem;
            color: var(--primary);
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px var(--secondary);
        }

        /* 右上角懸浮餐點總結 */
        .order-summary-float {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 3px solid var(--primary);
            border-radius: 16px;
            padding: 15px 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            z-index: 1000;
            max-width: 280px;
            width: 100%;
        }

        .order-summary-float h3 {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 8px;
            border-bottom: 2px dashed var(--secondary);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-items {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 8px;
            max-height: 100px;
            overflow-y: auto;
        }

        .summary-items div {
            margin-bottom: 3px;
        }

        .summary-total {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
            text-align: right;
        }

        /* 步驟區塊樣式 */
        .step-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            border: 2px solid rgba(247, 197, 159, 0.4);
            transition: transform 0.3s ease;
        }

        .step-section:hover {
            transform: translateY(-3px);
        }

        .step-title {
            font-size: 1.3rem;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-title span {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* 卡片選擇網格 (STEP 1) */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .option-card {
            background: #fff;
            border: 2px solid #eee;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option-card img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            border: 3px solid var(--secondary);
        }

        .option-card h4 {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .option-card .price {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.15rem;
        }

        .option-card.selected {
            border-color: var(--primary);
            background-color: #FFF4EE;
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.2);
        }

        .option-card.selected::after {
            content: '✓';
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--primary);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* 項目列表 (步驟 2, 3, 4 及飲品) */
        .list-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .list-item {
            background: #FAFAFA;
            border: 2px solid #EAEAEA;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item:hover {
            border-color: var(--secondary);
            background: #FFF;
        }

        .list-item.selected {
            background: #FFF4EE;
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 700;
        }

        /* 提交訂單按鈕 */
        .submit-container {
            text-align: center;
            margin-top: 40px;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), #FF8E53);
            color: white;
            border: none;
            padding: 16px 50px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(255, 107, 53, 0.5);
        }

        @media (max-width: 768px) {
            .order-summary-float {
                position: static;
                max-width: 100%;
                margin-bottom: 25px;
            }
            header h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 右上角懸浮餐點總結 -->
        <div class="order-summary-float">
            <h3><span>🛒 餐點總結</span> <span id="total-price">$0</span></h3>
            <div class="summary-items" id="summary-items-list">
                <div>正在載入試算表餐牌...</div>
            </div>
        </div>

        <header>
            <h1>EASY GO, EASY EAT!</h1>
            <p style="color: var(--accent); margin-top: 5px; font-weight: 500;">打造你的專屬健康輕食</p>
        </header>

        <!-- STEP 1 -->
        <div class="step-section">
            <div class="step-title"><span>STEP 1</span> 選擇特色外層 (Base)</div>
            <div class="options-grid" id="base-container">
                <!-- 由試算表動態載入 -->
            </div>
        </div>

        <!-- STEP 2 -->
        <div class="step-section">
            <div class="step-title"><span>STEP 2</span> 選擇蛋白質</div>
            <div class="list-options" id="protein-container">
                <!-- 由試算表動態載入 -->
            </div>
        </div>

        <!-- STEP 3 -->
        <div class="step-section">
            <div class="step-title"><span>STEP 3</span> 選擇醬汁</div>
            <div class="list-options" id="sauce-container">
                <!-- 由試算表動態載入 -->
            </div>
        </div>

        <!-- STEP 4 -->
        <div class="step-section">
            <div class="step-title"><span>STEP 4</span> 選擇特式醃菜</div>
            <div class="list-options" id="pickle-container">
                <!-- 由試算表動態載入 -->
            </div>
        </div>

        <!-- 套餐飲品 -->
        <div class="step-section">
            <div class="step-title"><span>DRINK</span> 套餐奉送以下飲品</div>
            <div class="list-options" id="drink-container">
                <!-- 由試算表動態載入 -->
            </div>
        </div>

        <!-- 提交按鈕 -->
        <div class="submit-container">
            <button class="btn-submit" onclick="submitOrder()">確認送出訂單</button>
        </div>
    </div>

    <script>
        // 你的 Google 試算表 CSV 發佈連結
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS5gg8oBHWFkx3TZvmsW4BXNdQQbeOcDLBcYVL-N6qAx9m7ZKX7ysOjyQPEyPp1SF7np8IQ_fy2Lgg/pub?output=csv';

        let currentOrder = {
            base: null,
            price: 0,
            protein: null,
            sauce: null,
            pickle: null,
            drink: null
        };

        // 簡單解析 CSV 格式的函數
        function parseCSV(text) {
            let lines = text.split('\n');
            let result = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                let row = lines[i].split(',').map(item => item.trim().replace(/^["']|["']$/g, ''));
                result.push(row);
            }
            return result;
        }

        // 自動加載 Google 試算表資料
        async function loadMenuData() {
            try {
                let response = await fetch(SHEET_CSV_URL);
                let data = await response.text();
                let rows = parseCSV(data);

                let baseHTML = '';
                let proteinHTML = '';
                let sauceHTML = '';
                let pickleHTML = '';
                let drinkHTML = '';

                rows.forEach(row => {
                    // 假設試算表欄位格式為: [類別(category), 名稱(name), 價格(price)]
                    // 類別包括: base, protein, sauce, pickle, drink
                    let category = row[0];
                    let name = row[1];
                    let price = row[2] ? parseFloat(row[2]) : 0;

                    if (category === 'base') {
                        // 判斷對應圖片
                        let img = name.includes('三文治') ? 'image_3.png' : 'image_2.png';
                        baseHTML += `
                            <div class="option-card" onclick="selectBase('${name}', ${price}, this)">
                                <img src="${img}" alt="${name}">
                                <h4>${name}</h4>
                                <div class="price">$${price}</div>
                            </div>
                        `;
                    } else if (category === 'protein') {
                        proteinHTML += `<div class="list-item" onclick="selectSingle('protein', '${name}', this)">${name}</div>`;
                    } else if (category === 'sauce') {
                        sauceHTML += `<div class="list-item" onclick="selectSingle('sauce', '${name}', this)">${name}</div>`;
                    } else if (category === 'pickle') {
                        pickleHTML += `<div class="list-item" onclick="selectSingle('pickle', '${name}', this)">${name}</div>`;
                    } else if (category === 'drink') {
                        drinkHTML += `<div class="list-item" onclick="selectSingle('drink', '${name}', this)">${name}</div>`;
                    }
                });

                document.getElementById('base-container').innerHTML = baseHTML || '<div>暫無資料</div>';
                document.getElementById('protein-container').innerHTML = proteinHTML || '<div>暫無資料</div>';
                document.getElementById('sauce-container').innerHTML = sauceHTML || '<div>暫無資料</div>';
                document.getElementById('pickle-container').innerHTML = pickleHTML || '<div>暫無資料</div>';
                document.getElementById('drink-container').innerHTML = drinkHTML || '<div>暫無資料</div>';

            } catch (error) {
                console.error('無法載入試算表資料:', error);
                document.getElementById('summary-items-list').innerHTML = '<div style="color:red;">載入菜單失敗，請檢查網絡或 CSV 連結。</div>';
            }
        }

        function selectBase(name, price, element) {
            document.querySelectorAll('.option-card').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            currentOrder.base = name;
            currentOrder.price = price;
            updateSummary();
        }

        function selectSingle(category, name, element) {
            const parent = element.parentElement;
            parent.querySelectorAll('.list-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            currentOrder[category] = name;
            updateSummary();
        }

        function updateSummary() {
            const listContainer = document.getElementById('summary-items-list');
            const priceContainer = document.getElementById('total-price');
            
            let html = '';
            if (currentOrder.base) html += `<div>• <b>${currentOrder.base}</b></div>`;
            if (currentOrder.protein) html += `<div>• 蛋白質: ${currentOrder.protein}</div>`;
            if (currentOrder.sauce) html += `<div>• 醬汁: ${currentOrder.sauce}</div>`;
            if (currentOrder.pickle) html += `<div>• 醃菜: ${currentOrder.pickle}</div>`;
            if (currentOrder.drink) html += `<div>• 飲品: ${currentOrder.drink}</div>`;

            if (html === '') {
                html = '<div>請選擇你的餐點...</div>';
            }

            listContainer.innerHTML = html;
            priceContainer.innerText = `$${currentOrder.price}`;
        }

        function submitOrder() {
            if (!currentOrder.base) {
                alert('請先選擇你的特色外層！');
                return;
            }
            alert(`多謝惠顧！你的餐點已成功記錄，總共 $${currentOrder.price}。`);
        }

        // 頁面載入時自動拉取試算表
        window.onload = loadMenuData;
    </script>
</body>
</html>
